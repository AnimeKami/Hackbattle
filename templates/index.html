<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PLR Capture</title>
<style>
  body { font-family: sans-serif; text-align: center; background: #111; color: #eee; }
  #flash { position: fixed; inset: 0; background: white; display: none; z-index: 999; }
  video { border-radius: 8px; margin-top: 20px; }
  button { padding: 10px 20px; font-size: 16px; margin-top: 20px; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.5; }
  #cameraStatus { font-weight: bold; }
  pre { text-align: left; max-width: 600px; margin: 20px auto; background: #222; padding: 10px; }
</style>
</head>
<body>
  <div id="flash"></div>
  <h2>Pupillary Light Reflex — Capture</h2>
  <p>Look at the camera. Click Start, keep your eye steady, the screen will flash white after 2 seconds.</p>
  <video id="video" width="480" height="360" autoplay muted></video><br>
  <p>Camera: <span id="cameraStatus">OFF</span></p>
  <button id="cameraBtn">Turn Camera On</button>
  <button id="startBtn" disabled>Start 6-second test</button>
  <pre id="output">Results will appear here.</pre>

<script>
const video = document.getElementById('video');
const flashDiv = document.getElementById('flash');
const output = document.getElementById('output');
const cameraBtn = document.getElementById('cameraBtn');
const cameraStatus = document.getElementById('cameraStatus');
const startBtn = document.getElementById('startBtn');
let stream = null;
let captureTimer = null;
let captureActive = false;

function turnCameraOff(message = 'Camera turned off.') {
  if (captureTimer !== null) {
    clearInterval(captureTimer);
    captureTimer = null;
  }
  captureActive = false;
  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }
  video.srcObject = null;
  video.removeAttribute('src');
  cameraStatus.textContent = 'OFF';
  cameraStatus.style.color = '#ff8080';
  cameraBtn.textContent = 'Turn Camera On';
  startBtn.disabled = true;
  flashDiv.style.display = 'none';
  if (message) output.textContent = message;
}

async function turnCameraOn() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;
    cameraStatus.textContent = 'ON';
    cameraStatus.style.color = '#80ff80';
    cameraBtn.textContent = 'Turn Camera Off';
    startBtn.disabled = false;
    output.textContent = 'Camera is on. Ready to start the test.';
  } catch (err) {
    stream = null;
    cameraStatus.textContent = 'OFF';
    cameraStatus.style.color = '#ff8080';
    output.textContent = 'Camera error: ' + err;
  }
}

cameraBtn.addEventListener('click', () => {
  if (stream) {
    turnCameraOff();
  } else {
    turnCameraOn();
  }
});

const canvas = document.createElement('canvas');
canvas.width = 320;
canvas.height = 240;
const ctx = canvas.getContext('2d');

function grabFrameBase64() {
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', 0.6);
}

startBtn.addEventListener('click', async () => {
  if (!stream || captureActive) return;
  captureActive = true;
  startBtn.disabled = true;
  output.textContent = 'Recording...';
  const frames = [];
  const durationMs = 6000;
  const flashAtMs = 2000;
  const fps = 15;
  const intervalMs = 1000 / fps;
  const startTime = performance.now();
  let flashFired = false;

  captureTimer = setInterval(() => {
    if (!stream) {
      return;
    }
    const now = performance.now() - startTime;
    if (now >= flashAtMs && !flashFired) {
      flashDiv.style.display = 'block';
      flashFired = true;
      setTimeout(() => { flashDiv.style.display = 'none'; }, 400);
    }
    frames.push({ t: now / 1000, image: grabFrameBase64() });
    if (now >= durationMs) {
      clearInterval(captureTimer);
      captureTimer = null;
      captureActive = false;
      sendFrames(frames);
    }
  }, intervalMs);
});

async function sendFrames(frames) {
  output.textContent = `Captured ${frames.length} frames. Sending to backend...`;
  try {
    const res = await fetch('/analyze_session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ flash_time: 2.0, frames })
    });
    const data = await res.json();
    output.textContent = JSON.stringify(data.metrics, null, 2);
  } catch (e) {
    output.textContent = 'Error contacting backend: ' + e;
  } finally {
    if (stream) startBtn.disabled = false;
  }
}
</script>
</body>
</html>
